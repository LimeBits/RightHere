name: CI Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.5"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-ci-package:
    name: Build unsigned CI package
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Build unsigned CI DMG
        shell: bash
        run: ./Scripts/package-dmg.sh --build --universal --skip-signing

      - name: Find DMG
        id: artifact
        shell: bash
        run: |
          dmg="$(ls -t dist/RightHere-*.dmg | head -1)"
          shasum -a 256 "${dmg}" > "${dmg}.sha256"
          echo "dmg=${dmg}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${dmg}.sha256" >> "${GITHUB_OUTPUT}"

      - name: Upload unsigned CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: RightHere-${{ steps.release.outputs.tag }}-unsigned-ci
          path: |
            ${{ steps.artifact.outputs.dmg }}
            ${{ steps.artifact.outputs.sha256 }}
          if-no-files-found: error
