name: RightHere
options:
  bundleIdPrefix: com.LimeBits
  deploymentTarget:
    macOS: "12.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  RightHere:
    type: application
    platform: macOS
    sources:
      - path: RightHere
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.LimeBits.RightHere
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: YES
        ENABLE_HARDENED_RUNTIME: YES
        DEVELOPMENT_TEAM: ""
        MACOSX_DEPLOYMENT_TARGET: "12.0"
        INFOPLIST_FILE: RightHere/Info.plist
        SPARKLE_PUBLIC_ED_KEY: ""
        CURRENT_PROJECT_VERSION: "8"
        MARKETING_VERSION: "0.1.11"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    entitlements:
      path: RightHere/RightHere.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - group.com.LimeBits.RightHere
    attributes:
      SystemCapabilities:
        com.apple.Sandbox:
          enabled: 1
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    dependencies:
      - target: RightHereExtension
      - package: Sparkle
        product: Sparkle

  RightHereExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: RightHereExtension
      - path: RightHere/SharedDefaults.swift
      - path: RightHere/TemplateAssets.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.LimeBits.RightHere.Extension
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: YES
        ENABLE_HARDENED_RUNTIME: YES
        DEVELOPMENT_TEAM: ""
        MACOSX_DEPLOYMENT_TARGET: "12.0"
        INFOPLIST_FILE: RightHereExtension/Info.plist
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks
        CURRENT_PROJECT_VERSION: "8"
        MARKETING_VERSION: "0.1.11"
    entitlements:
      path: RightHereExtension/RightHereExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.com.LimeBits.RightHere
        com.apple.security.files.downloads.read-write: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /Desktop/
          - /Documents/
          - /Library/Mobile Documents/com~apple~CloudDocs/Documents/
    attributes:
      SystemCapabilities:
        com.apple.Sandbox:
          enabled: 1
        com.apple.ApplicationGroups.iOS:
          enabled: 1
